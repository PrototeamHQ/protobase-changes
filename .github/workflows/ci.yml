name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Start Postgres
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=test -p 127.0.0.1:5432:5432 postgres:18 -c wal_level=logical
          timeout 60 sh -c 'until docker exec postgres pg_isready -U postgres -h 127.0.0.1; do sleep 1; done'
          docker exec postgres psql -U postgres -c 'CREATE DATABASE lakekeeper'
      - name: Start an Iceberg REST catalog
        run: tests/catalog/start.sh "$RUNNER_TEMP/catalog" postgres://postgres:test@127.0.0.1:5432/lakekeeper >> "$GITHUB_ENV"
      - name: Test
        env:
          PCS_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
          go build ./...
          go vet -tags integration ./...
          go test -race -tags integration ./tests/
